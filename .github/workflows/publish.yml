name: Publish MCP registry entries
on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Server directory name, or all'
        required: true
        default: all
permissions:
  contents: read
  id-token: write
concurrency:
  group: mcp-registry-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Install verified MCP publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSL "$base_url/$archive" -o "$archive"
          curl -fsSL "$base_url/$archive.sigstore.json" -o "$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Validate and publish selected manifests
        env:
          REQUESTED_SERVER: ${{ inputs.server }}
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, subprocess
          root=pathlib.Path('servers')
          names=sorted(p.name for p in root.iterdir() if p.is_dir() and (p/'server.json').is_file())
          selected=os.environ['REQUESTED_SERVER']
          if selected != 'all' and selected not in names:
              raise SystemExit('Unknown server directory')
          for name in names if selected == 'all' else [selected]:
              path=str(root/name/'server.json')
              subprocess.run(['./mcp-publisher','validate',path],check=True)
              subprocess.run(['./mcp-publisher','publish',path],check=True)
          PYCODE
